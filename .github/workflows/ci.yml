name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: No known vulnerabilities in dependencies
        run: npm audit --audit-level=moderate
      - name: Tests (simulated PayPal and reviewer, no secrets)
        run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Build (memory logged every 5 s, capped so a runaway build fails instead of freezing the runner)
        run: |
          (while true; do echo "[mem] $(free -m | awk '/Mem:/ {print $3" MB used"}') top: $(ps -eo rss,comm --sort=-rss | sed -n 2,3p | awk '{printf "%s %d MB; ", $2, $1/1024}')"; sleep 5; done) &
          systemd-run --user --scope -p MemoryMax=6G -p MemorySwapMax=0 npm run build || (echo "build failed with $?"; exit 1)
      - name: The judge's path on the production build (replayed demos, no keys)
        run: |
          POD_SEED_BOARD=1 POD_DATA_DIR=$RUNNER_TEMP/pod npm start -- --port 3000 &
          npm run smoke -- http://localhost:3000
