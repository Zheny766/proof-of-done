name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: No known vulnerabilities in dependencies
        run: npm audit --audit-level=moderate
      - name: Tests (simulated PayPal and reviewer, no secrets)
        run: npm test
      - run: npm run lint
      - run: npm run typecheck
      # The Bryntum Gantt makes the production build large; private-repo runners have little memory.
      - name: More swap for the build
        run: sudo fallocate -l 8G /swapfile-build && sudo chmod 600 /swapfile-build && sudo mkswap /swapfile-build && sudo swapon /swapfile-build && free -m
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: The judge's path on the production build (replayed demos, no keys)
        run: |
          POD_SEED_BOARD=1 POD_DATA_DIR=$RUNNER_TEMP/pod npm start -- --port 3000 &
          npm run smoke -- http://localhost:3000
