# Hosted demo on Render's free plan. Without keys PayPal and the reviewer run simulated. With the
# PayPal sandbox keys and an Anthropic key (set them in the Render dashboard, they are not in this
# file) it runs the real flow, on Claude Haiku to keep each review under a cent; give that key its
# own workspace with a spend limit. The disk is wiped on every restart, and POD_SEED_DEMO puts the
# labelled demo data back; POD_SEED_BOARD keeps a few demo jobs on the open board for visitors'
# agents, POD_ARENA_DAILY caps the live "Try to fool it" attempts a day, and POD_DEMO_REVIEWS_DAILY caps
# all live Claude reviews on demo deals (board jobs and the challenge) a day; after it they are simulated.
services:
  - type: web
    name: proof-of-done
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: POD_SEED_DEMO
        value: "1"
      - key: POD_SEED_BOARD
        value: "1"
      - key: POD_ARENA_DAILY
        value: "10"
      - key: POD_DEMO_REVIEWS_DAILY
        value: "15"
      - key: POD_REVIEW_MODEL
        value: claude-haiku-5-5
      - key: CLAUDE_MODELS
        value: claude-haiku-5-5
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
